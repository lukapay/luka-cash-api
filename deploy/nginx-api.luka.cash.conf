# /etc/nginx/sites-available/api.luka.cash (certbot añade el bloque 443)
server {
  server_name api.luka.cash;
  client_max_body_size 1m;          # la API recibe JSON; los documentos van directo a Spaces
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # la API usa X-Real-IP (lo fija nginx); X-Forwarded-For solo como respaldo
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
}
